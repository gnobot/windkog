<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | WINDKOG</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="/favicon.ico">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 65vh;
            text-align: center;
            padding: 2rem;
            margin-top: 1.5rem;
        }

        .error-card {
            background: rgba(4, 8, 20, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-white);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 580px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.02);
            animation: fadeIn 0.8s ease-out forwards;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: var(--primary);
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }

        .error-subtitle {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .error-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        @media (max-width: 500px) {
            .error-actions {
                flex-direction: column;
                gap: 0.75rem;
            }
            .error-actions button, .error-actions a {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Premium Header -->
    <header>
        <h1>WIND KOG</h1>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/#technology">Technology</a>
            <a href="/#design-showcase">Showcase</a>
            <a href="/#history-section">History</a>
            <a href="/#stem-section">STEM Kits</a>
            <a href="/contact">Contact</a>
            <a href="/investors">Investors</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main>
        
        <div class="error-container">
            <div class="error-card">
                <div class="error-code">404</div>
                <h2 class="error-subtitle">Rotational Disconnect</h2>
                <p class="error-text">
                    The aerodynamic coordinates or page trajectory you requested do not exist or have been redirected to another velocity path.
                </p>
                <div class="error-actions">
                    <a href="/" style="text-decoration: none;">
                        <button style="padding: 0.75rem 1.5rem;">Return Homepage</button>
                    </a>
                    <a href="/contact" style="text-decoration: none;">
                        <button class="secondary-btn" style="padding: 0.75rem 1.5rem;">Contact Engineering</button>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-brand">WIND KOG</div>
        <hr>
        <div class="footer-copyright">All rights reserved &bull; windkog.com &bull; Copyright &copy; 2026</div>
    </footer>

</body>
</html>
